<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Your Luxa password changed</title>
  </head>
  <body
    style="margin: 0; background: #f5f4f0; color: #202631; font-family: Arial, sans-serif"
  >
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
      <tr>
        <td align="center" style="padding: 40px 16px">
          <table
            role="presentation"
            width="100%"
            cellspacing="0"
            cellpadding="0"
            style="max-width: 600px; border: 1px solid #dedbd2; background: #fffefa"
          >
            <tr>
              <td style="padding: 32px">
                <p
                  style="
                    margin: 0 0 14px;
                    color: #17785f;
                    font-size: 11px;
                    font-weight: 700;
                    letter-spacing: 1.4px;
                    text-transform: uppercase;
                  "
                >
                  Luxa account security
                </p>
                <h1
                  style="
                    margin: 0;
                    font-size: 26px;
                    line-height: 1.2;
                    letter-spacing: -0.8px;
                  "
                >
                  Your password was changed.
                </h1>
                <p
                  style="
                    margin: 18px 0 0;
                    color: #596273;
                    font-size: 14px;
                    line-height: 1.7;
                  "
                >
                  The password for {{ .Email }} was updated. If this was not you, use
                  account recovery immediately and ask an administrator to freeze your
                  access while the incident is reviewed.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
